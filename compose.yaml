services:
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8080:8080"
    command: [
      "-m", "/models/Meta-Llama-3.1-8B-Instruct-GGUF/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf",
      "--host", "0.0.0.0", 
      "--port", "8080", 
      "-n", "512",
      "--n-gpu-layers", "32"
    ]
    volumes:
      - ./llm-models:/models

  bot:
    build: 
      dockerfile: docker/bot.dockerfile
      target: dev
    environment:
      - TAVERN_BOT_TOKEN=$TAVERN_BOT_TOKEN
      - TAVERN_OPENAI_BASE=$TAVERN_OPENAI_BASE
      - TAVERN_OPENAI_API_KEY=$TAVERN_OPENAI_API_KEY
    volumes:
      - ./bot:/app

  api:
    build: 
      dockerfile: docker/api.dockerfile
    ports:
      - "5000:8080"
    environment:
      TAVERN_HOSTNAME: $TAVERN_HOSTNAME
      DISCORD_CLIENT_ID: $DISCORD_CLIENT_ID
      DISCORD_CLIENT_SECRET: $DISCORD_CLIENT_SECRET
      DISCORD_REDIRECT_URI: $DISCORD_REDIRECT_URI
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}/${POSTGRES_DB}
      JWT_SECRET: $JWT_SECRET
    volumes:
      - ./api/src:/app/src

  app:
    build:
      dockerfile: docker/web.dockerfile
    ports:
      - "3000:8080"
    volumes:
      - ./app/src:/app/src
      - ./app/public:/app/public
      - ./app/index.html:/app/index.html
      - ./app/vite.config.ts:/app/vite.config.ts
      - ./app/tsconfig.json:/app/tsconfig.json
      - ./app/tsconfig.node.json:/app/tsconfig.node.json
      - ./app/tsconfig.app.json:/app/tsconfig.app.json
      - ./app/package.json:/app/package.json
      - ./app/package-lock.json:/app/package-lock.json

  admin:
    build: 
      dockerfile: docker/admin.dockerfile
    volumes:
      - ./admin:/app
      - ./db/migrations:/db/migrations
    environment:
      - POSTGRES_HOST=$POSTGRES_HOST
      - POSTGRES_USER=$POSTGRES_USER
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      - POSTGRES_DB=$POSTGRES_DB
    working_dir: /app
    entrypoint: ["python"]

volumes:
  postgres-data: